name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for SideStore re-signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 200

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          rm -rf Payload QRScanner.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry QRScanner.ipa Payload
          ls -la QRScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-ipa
          path: QRScanner.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
